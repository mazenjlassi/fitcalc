<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found — fitcalc</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --text: #17201a;
        --muted: #4c5850;
        --accent: #0b6b45;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1210;
          --text: #eef2ee;
          --muted: #b4c0b7;
          --accent: #7ddbaa;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
        line-height: 1.6;
      }
      main {
        max-width: 36rem;
      }
      p {
        color: var(--muted);
      }
      a {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <p>404</p>
      <h1>Page not found</h1>
      <p>The page you asked for does not exist. The calculators are still here.</p>
      <p><a href="/">Go to the home page</a></p>
    </main>
  </body>
</html>
